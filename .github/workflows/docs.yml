name: docs

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build ansicube
        run: go build -trimpath -o ansicube .

      - name: Install VHS
        uses: charmbracelet/vhs-action@v2

      - name: Render screenshots
        run: |
          mkdir -p docs/assets/screenshots
          for tape in docs/tapes/*.tape; do
            echo "::group::$tape"
            vhs "$tape"
            echo "::endgroup::"
          done
          ls -l docs/assets/screenshots

      - uses: astral-sh/setup-uv@v10

      - name: Build site
        run: uvx zensical@0.1.3 build --clean --strict

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/assets/screenshots

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
