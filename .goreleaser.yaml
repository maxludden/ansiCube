version: 2

project_name: ansicube

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ansicube
    main: .
    binary: ansicube
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: ansicube
    repository:
      owner: maxludden
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/maxludden/ansiCube"
    description: "Interactive ANSI 256-color explorer for the terminal"
    license: "MIT"
    binaries: [ ansicube ]
    # The binaries are not notarized; strip the quarantine flag so macOS
    # Gatekeeper does not block the first launch.
    hooks:
      post:
        install_steps: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ansicube"]
          end
    commit_author:
      name: Max Ludden
      email: maxludden@users.noreply.github.com
